[package]
name = "raea-runtime-live"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "A composition stepped live at the display's rate: its page, 3D and sound each frame, with the person's keys and pointer"

[dependencies]
raea-runtime-react = { path = "../../runtime/react", default-features = false }
raea-runtime-page = { path = "../page" }
raea-runtime-sound = { path = "../sound", default-features = false }
raea-runtime-export = { path = "../export" }
raea-runtime-bake = { path = "../bake" }
raea-render = { path = "../../engine/render", default-features = false, features = ["native"] }
raea-gpu-device = { path = "../../gpu/device" }
raea-io-net = { path = "../../io/net" }
raea-io-trace = { path = "../../io/trace" }
raea-core-program = { path = "../../core/program" }
raea-sys-mix = { path = "../../systems/mix" }
raea-sys-frame = { path = "../../systems/frame" }
raea-sys-hold = { path = "../../systems/hold" }
bevy = { version = "=0.20.0", default-features = false, features = ["std", "default_app"] }
serde_json = "1"
wgpu = "=30.0.1"
winit = "=0.30.13"
image = { version = "0.25", default-features = false, features = ["png", "hdr"] }
twox-hash = { version = "2", default-features = false, features = ["xxhash3_64"] }
# the output device warmed before the mixer opens it (warm_audio), the same cpal the legacy app uses
cpal = "0.15"
