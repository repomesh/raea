# Each crate of ours and its layer (docs/overhaul.md, "Layers"). tools/layers.sh reads this file. A dependency may
# point down to a lower layer. Within a layer, it may point sideways only where the layer allows it: core, io,
# gpu, runtime, apps and tools do; systems don't, except to a crate listed under [facility]. Vendored crates sit
# below everything. A crate missing from this file fails the check: give every new crate its layer here.
# The order, lowest first: core io gpu systems runtime sdk apps tools

