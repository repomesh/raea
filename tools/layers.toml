# systems that hold only a facility another system may build on (docs/overhaul.md: the mixer graph, ONNX sessions,
# Vision requests, K kernels on the GPU)
[facility]
# the frame's rows every pass reads (FrameRows, the edit, the clock, row helpers)
raea-sys-frame = true
# the layer pass's keys, table, raster and NAME.layers (raea-sys-frame records the 3D through it)
raea-sys-layers = true
# a row's standard material and its maps (meshseq builds its mesh's on it)
raea-sys-material = true
# a row's mesh from JSON, Bevy's primitives by name (materials and reflected Mesh handles build on it)
raea-sys-mesh = true
# how a texture is read (materials, shaders and models set it the same way)
raea-sys-sampler = true
# a shader's inputs, accessors and registration (surface shaders and frame passes share them)
raea-sys-shader = true
# a WGSL source read as text: uniform and storage layouts, bindings renumbered (raea-sys-shader builds on it)
raea-sys-shader-wgsl = true
# the pass mask (looks and the paint look read which pass drew each pixel)
raea-sys-compose = true
# ink outlines (the frame's look sets its camera's)
raea-sys-post = true
# the froxel grid and glass fogged through it (looks and greybox surfaces keep a mesh's fog copy)
raea-sys-fog = true
# simulated volumes (a fire row with a sim is one)
raea-sys-volume = true
# the scene's ray tracing (the traced-light pass reads its scene)
raea-sys-rt = true
raea-sys-mix = true
raea-sys-tone = true
raea-sys-ml = true
raea-sys-mlx = true
raea-sys-layout = true
raea-sys-vision = true
# a file's encoder columns (Fingerprint's heads read them)
raea-sys-columns = true
# a fingerprint's taxonomy, evidence and heads (raea-sys-fingerprint-use scores, compares and picks with them)
raea-sys-fingerprint = true
# grow, profile and the heads' readings over a file (raea-sys-fingerprint-things reads things on them)
raea-sys-fingerprint-use = true
raea-sys-song = true
raea-sys-k = true
raea-sys-wear = true
raea-sys-procmat = true
raea-sys-canvas = true
raea-sys-filters = true
raea-sys-page = true
# a page's loads (raea-sys-page's net)
raea-sys-page-net = true
# the op wire applied to a page (raea-sys-page's ops)
raea-sys-page-ops = true
raea-sys-fonts = true
raea-sys-image = true
